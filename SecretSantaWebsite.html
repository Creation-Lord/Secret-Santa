<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Santa</title>
  <style>
    :root {
      --bg-1: #fff7ed;
      --bg-2: #f5f3ff;
      --card: url(image.png);
      --primary: #b45309;
      --primary-dark: #78350f;
      --text: #1f2937;
      --secondary: #673f2c;
      --accent: #fbbf24;
      --light: #fef3c7;
      --border: #f3e8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    .container {
      width: min(100%, 600px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(120, 53, 15, 0.1);
      padding: 32px 28px;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      color: var(--primary-dark);
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .subtitle {
      text-align: center;
      margin: 0 0 28px;
      color: var(--secondary);
      font-size: 0.9rem;
    }

    .infobox {
      display: flex;   
      gap: 12px;
    }

    .panel {
      background: linear-gradient(135deg, #ea9090c9, #99e392bd);
      border: 1px solid s#f3e8ff;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    .panel h2 {
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: 1.5rem;
    }

    .panel p {
      margin: 0;
      color: var(--text);
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    button2 {
      border: none;
      border-radius: 999px;
      padding: 1px 1px;
      background: var(--secondary);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button2:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .input {
      background: #f3f4f6;
      color: var(--text);
      border: 1px solid #e5e7eb;
      padding: 12px;
      font-size: 0.875rem;
    }

    .input:hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Secret Santa</h1>
    <p class="subtitle">Make your list, scramble the names,<br> and send them off with full secrecy</p>

    <div class="actions">
      <input type="text" class="input" id="name" placeholder="Enter name" />
      <input type="text" class="input" id="email" placeholder="Enter email" />
      <button onclick="addPeopleToList()">Add Person</button>
    </div>

    <section class="panel">
      <h2>List</h2>
      <p id="list"></p>
    </section>

    <div class="actions">
      <button onclick="process()">Scramble Names</button>
    </div>



    <script src="SecretSantaWebsiteJS.js" defer></script>
  </main>
</body>
</html>
